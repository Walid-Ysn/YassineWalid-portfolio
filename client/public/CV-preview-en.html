<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yassine Walid — CV Preview</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: #e9e9e7; color: #171717; font-family: Inter, Arial, sans-serif; }
    header { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 20px; background: rgba(250,250,248,.96); border-bottom: 1px solid #d7d7d2; }
    h1 { margin: 0; font-size: 16px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    a { color: inherit; }
    .button { display: inline-block; padding: 9px 14px; border-radius: 7px; background: #171717; color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; }
    .button.secondary { background: transparent; color: #171717; border: 1px solid #b8b8b2; }
    main { padding: 28px 16px 48px; }
    .paper { max-width: 794px; margin: 0 auto; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.14); }
    .paper img { display: block; width: 100%; height: auto; }
    @media (max-width: 640px) { header { align-items: flex-start; flex-direction: column; } .actions { width: 100%; } .button { flex: 1; text-align: center; } }
  </style>
</head>
<body>
  <header>
    <h1>Yassine Walid — CV Preview</h1>
    <div class="actions">
      <a class="button" href="/CV-Walid-Yassine.pdf" download="CV-Yassine-WALID-EN.pdf">Download PDF</a>
      <a class="button secondary" href="/">Back to portfolio</a>
    </div>
  </header>
  <main><div class="paper"><img src="/CV-preview-en.png" alt="Preview of Yassine Walid's English CV" /></div></main>
</body>
</html>
